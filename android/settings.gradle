include ':app'

pluginManagement {
    def flutterSdkPath = "${rootProject.projectDir}/../"
    
    // Ensure the Flutter SDK is found
    if (!file(flutterSdkPath).exists()) {
        throw new GradleException("Flutter SDK not found at: $flutterSdkPath")
    }
    
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

gradlePlugin {
    plugins {
        id "dev.flutter.flutter-plugin-loader" version "1.0.0"
        id "com.android.application" version "9.0.1"
        id "org.jetbrains.kotlin.android" version "2.3.20"
    }
}